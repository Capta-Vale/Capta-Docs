site_name: Capta.Credivoucher — Manual de Desarrollo
site_url: https://capta-vale.github.io/Capta-Docs/
site_description: Reglas institucionales, estándares y guías del sistema Capta.Credivoucher
site_author: Comité de Arquitectura — Capta Vale

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - toc.integrate
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: es

nav:
  - Inicio: index.md

  - Mapeados:
    - Mapeado Completo: mapeados/index.md

  - Empezar:
    - Bienvenida: empezar/bienvenida.md
    - Setup local: empezar/setup-local.md
    - Tu primer cambio: empezar/primer-cambio.md

  - Arquitectura:
    - Visión general: arquitectura/vision-general.md
    - Capas: arquitectura/capas.md
    - Patrones: arquitectura/patrones.md
    - Decisiones: arquitectura/decisiones.md
    - Antipatrones: arquitectura/antipatrones.md

  - Estándares:
    - Nombres: estandares/nombres.md
    - Código C#: estandares/codigo-cs.md
    - Código JavaScript: estandares/codigo-js.md
    - Vistas Razor: estandares/codigo-cshtml.md
    - SQL: estandares/codigo-sql.md
    - Commits y ramas: estandares/commits.md

  - Guías:
    - Crear endpoint: guias/crear-endpoint.md
    - Crear tabla: guias/crear-tabla.md
    - Crear reporte: guias/crear-reporte.md
    - Agregar notificación: guias/agregar-notificacion.md
    - Agregar autorización: guias/agregar-autorizacion.md
    - Agregar bitácora: guias/agregar-bitacora.md
    - Crear servicio Windows: guias/crear-servicio-windows.md
    - Crear Web API: guias/crear-web-api.md

  - Procesos:
    - Onboarding: procesos/onboarding.md
    - Code review: procesos/code-review.md
    - QA: procesos/qa.md
    - Despliegue: procesos/despliegue.md
